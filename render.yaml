services:
  - type: web
    name: blurt-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WEB_ORIGIN
        fromService:
          name: blurt-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: blurt-web
    runtime: static
    rootDir: apps/web
    buildCommand: node scripts/write-api-config.mjs && npm ci --include=dev && npm run build
    staticPublishPath: dist/web/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://blurt-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_BASE_URL
        value: /api
