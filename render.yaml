services:
  - type: web
    name: blurt-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary

  - type: web
    name: blurt-web
    runtime: static
    rootDir: apps/web
    buildCommand: node scripts/write-api-config.mjs && npm ci --include=dev && npm run build
    staticPublishPath: dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_BASE_URL
        fromService:
          name: blurt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
