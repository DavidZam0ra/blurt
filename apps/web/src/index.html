<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blurt</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Static splash, independent of the Angular bundle and global
         stylesheet — shows immediately and covers the app initializer's
         wait on GET /auth/me (slow on Render's free-tier cold start).
         Angular replaces this markup with the real app once it bootstraps. */
      body {
        margin: 0;
        background: #161826;
      }
      .app-splash {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash svg {
        animation: app-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <svg viewBox="0 0 64 64" width="40" height="40" fill="none" aria-label="Blurt">
          <rect x="25" y="9" width="14" height="25" rx="7" fill="#9184d9" />
          <path d="M19 32a13 13 0 0 0 26 0" stroke="#9184d9" stroke-width="4" stroke-linecap="round" />
          <line x1="32" y1="47" x2="32" y2="41" stroke="#9184d9" stroke-width="4" stroke-linecap="round" />
          <line x1="25" y1="50" x2="39" y2="50" stroke="#9184d9" stroke-width="4" stroke-linecap="round" />
          <line x1="46" y1="14" x2="54" y2="9" stroke="#9184d9" stroke-width="3.5" stroke-linecap="round" />
          <line x1="48" y1="23" x2="57" y2="22" stroke="#9184d9" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
