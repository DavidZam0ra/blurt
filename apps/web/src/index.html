<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blurt</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-16.png" sizes="16x16" />
    <link rel="icon" href="icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Static splash, independent of the Angular bundle and global
         stylesheet — shows immediately and covers the app initializer's
         wait on GET /auth/me (slow on Render's free-tier cold start).
         Angular replaces this markup with the real app once it bootstraps. */
      body {
        margin: 0;
        background: #161826;
      }
      .app-splash {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('assets/pattern-soundwave.svg');
        background-size: 120px 120px;
      }
      .app-splash svg {
        animation: app-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash">
        <svg viewBox="0 0 64 64" width="40" height="40" fill="none" aria-label="Blurt">
          <rect x="23" y="7" width="18" height="30" rx="9" stroke="#9184d9" stroke-width="2.5" />
          <rect x="26.5" y="11" width="11" height="22" rx="5.5" fill="#b5abfc" />
          <path d="M17 30a15 15 0 0 0 30 0" stroke="#9184d9" stroke-width="3" stroke-linecap="round" />
          <line x1="32" y1="52" x2="32" y2="45" stroke="#9184d9" stroke-width="3" stroke-linecap="round" />
          <line x1="25" y1="52" x2="39" y2="52" stroke="#9184d9" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
