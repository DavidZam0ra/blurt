name: Keep Render services awake

# Render's free plan spins a web service down after ~15 min without an
# incoming request, and the next request then pays a ~30-40s cold start.
# Pinging both services well inside that window keeps them warm. Each
# service's own free-tier instance-hour quota (750h/month) covers running
# 24/7 on its own, so this doesn't cost anything extra.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # --max-time 90: a service that's been asleep can take up to ~40s just
      # to wake, on top of its own response time. 30s was too tight and
      # false-failed the job on a genuinely cold instance.
      - name: Ping blurt-web (production)
        run: curl -fsS --max-time 90 https://blurt-web.onrender.com/ -o /dev/null
      - name: Ping blurt-web-staging
        run: curl -fsS --max-time 90 https://blurt-web-staging.onrender.com/ -o /dev/null
